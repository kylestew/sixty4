[package]
name = "sixty4"
version = "0.1.0"
edition = "2024"
default-run = "desktop"

[dependencies]
anyhow = { version = "1.0", optional = true }
winit = { version = "0.29.0", optional = true }
pixels = { version = "0.15", optional = true }

[dev-dependencies]

[features]
default = []
desktop = ["dep:anyhow", "dep:winit", "dep:pixels"]

[[bin]]
name = "desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]
